[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seesion-history"
version = "0.1.0"
description = "按本地显示时间截取 Codex 和 Claude JSONL 会话历史"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seesion = "seesion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
