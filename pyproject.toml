[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-truncation"
version = "0.1.0"
description = "Truncate Codex and Claude JSONL session history by display time"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
session = "session_truncation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
